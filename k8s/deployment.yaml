apiVersion: apps/v1
kind: Deployment
metadata: {name: devops-task}
spec:
  replicas: 2
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app: devops-task}}
  template:
    metadata: {labels: {app: devops-task}}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: app
          image: ghcr.io/sajidZ-904/devops-service:sha-latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 3000}]
          envFrom: [{configMapRef: {name: devops-task-config}}, {secretRef: {name: devops-task-secrets}}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 250m, memory: 256Mi}}
          livenessProbe: {httpGet: {path: /health, port: 3000}, initialDelaySeconds: 5, periodSeconds: 10}
          readinessProbe: {httpGet: {path: /health, port: 3000}, initialDelaySeconds: 3, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: devops-task}
spec: {selector: {app: devops-task}, ports: [{port: 80, targetPort: 3000}], type: ClusterIP}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: devops-task}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: devops-task}
  minReplicas: 2
  maxReplicas: 5
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}}]
