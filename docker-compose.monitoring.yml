services:
  devops-task-service:
    build: .
    image: devops-task-service:local
    environment: {PORT: "3000", LOG_LEVEL: info, ENVIRONMENT: local, APP_VERSION: local}
    networks: [observability]
  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes: ["./monitoring/prometheus:/etc/prometheus:ro", "prometheus-data:/prometheus"]
    networks: [observability]
  loki:
    image: grafana/loki:3.2.1
    command: -config.file=/etc/loki/config.yml
    volumes: ["./monitoring/loki:/etc/loki:ro", "loki-data:/loki"]
    networks: [observability]
  alloy:
    image: grafana/alloy:v1.5.1
    command: run /etc/alloy/config.alloy
    volumes: ["./monitoring/alloy:/etc/alloy:ro", "/var/run/docker.sock:/var/run/docker.sock:ro", "/var/lib/docker/containers:/var/lib/docker/containers:ro"]
    networks: [observability]
  node-exporter:
    image: prom/node-exporter:v1.8.2
    command: ["--path.rootfs=/host"]
    volumes: ["/:/host:ro,rslave"]
    networks: [observability]
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    volumes: ["/:/rootfs:ro", "/var/run:/var/run:ro", "/sys:/sys:ro", "/var/lib/docker:/var/lib/docker:ro"]
    networks: [observability]
  grafana:
    image: grafana/grafana:11.3.1
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}"
    volumes: ["./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro", "./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro", "grafana-data:/var/lib/grafana"]
    networks: [observability]
networks: {observability: {internal: true}}
volumes: {prometheus-data: {}, loki-data: {}, grafana-data: {}}
