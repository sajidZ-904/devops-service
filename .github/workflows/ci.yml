name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --coverage
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: scripts

  image:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: devops-task-service:test
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: devops-task-service:test
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=${{ vars.APP_VERSION }},enable=${{ vars.APP_VERSION != '' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy through SSM with rollback
        env:
          IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          test -n "$INSTANCE_ID"
          aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
            --parameters "commands=[\"docker inspect --format '{{.Config.Image}}' devops-task-service > /tmp/previous-image || true\",\"docker pull $IMAGE\",\"docker rm -f devops-task-service || true\",\"docker run -d --name devops-task-service --restart unless-stopped -p 80:3000 -e PORT=3000 -e LOG_LEVEL=info -e ENVIRONMENT=production -e APP_VERSION=$IMAGE $IMAGE\",\"curl --fail --retry 12 --retry-delay 2 http://127.0.0.1:3000/health || (docker rm -f devops-task-service; test ! -s /tmp/previous-image || docker run -d --name devops-task-service --restart unless-stopped -p 80:3000 $(cat /tmp/previous-image); exit 1)\"]" --output json
