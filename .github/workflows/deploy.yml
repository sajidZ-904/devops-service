name: Build, Push, and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  # Override with the AWS_REGION repository variable when the ECR repository and
  # EC2 instance live in a different region than this default.
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  ECR_REPOSITORY: devops-task-service
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID || secrets.EC2_INSTANCE_ID || 'i-03faafe8f90656db6' }}

jobs:
  build-push:
    name: Build and push multi-architecture image
    runs-on: [self-hosted, linux, x64]
    outputs:
      image: ${{ steps.image.outputs.image }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read semantic version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^[[:space:]]*"version":[[:space:]]*"\([^"]*\)".*/\1/p' package.json | head -n 1)
          if [ -z "$version" ]; then
            echo 'Unable to read the "version" field from package.json' >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Validate deployment configuration
        shell: bash
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [ -z "${ROLE_ARN:-}" ]; then
            echo '::error title=AWS_ROLE_ARN missing::Repository secret AWS_ROLE_ARN is empty. Add it under Settings > Secrets and variables > Actions > Secrets (not the Variables tab, not an environment secret).'
            exit 1
          fi
          case "$ROLE_ARN" in
            arn:aws:iam::*:role/*) ;;
            *)
              echo '::error title=AWS_ROLE_ARN invalid::AWS_ROLE_ARN is not an IAM role ARN. Expected arn:aws:iam::<account-id>:role/<role-name>.'
              exit 1
              ;;
          esac
          echo "Target AWS region: $AWS_REGION"

      # TEMPORARY DEBUG STEP: prints the OIDC claims GitHub sends to AWS.
      # Remove it once the role assumption works.
      - name: Show OIDC claims
        shell: bash
        run: |
          TOKEN=$(curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{sub, aud, repository, ref}' || true

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}
      - name: Verify ECR repository exists
        shell: bash
        run: |
          set -euo pipefail
          if uri=$(aws ecr describe-repositories \
                --repository-names "$ECR_REPOSITORY" \
                --region "$AWS_REGION" \
                --query 'repositories[0].repositoryUri' \
                --output text 2>/dev/null); then
            echo "ECR repository: $uri"
            exit 0
          fi
          echo "Unable to describe ECR repository '$ECR_REPOSITORY' in $AWS_REGION." >&2
          echo 'If it does not exist yet, create it:' >&2
          echo "  aws ecr create-repository --repository-name $ECR_REPOSITORY --region $AWS_REGION --image-scanning-configuration scanOnPush=true --encryption-configuration encryptionType=AES256" >&2
          echo 'If it does exist, grant the assumed role ecr:DescribeRepositories.' >&2
          exit 1
      - name: Authenticate to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Set image reference
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: echo "image=$REGISTRY/$ECR_REPOSITORY" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ github.sha }}
            ${{ steps.image.outputs.image }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2 through Systems Manager
    needs: build-push
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Validate deployment configuration
        shell: bash
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          INSTANCE_ID: ${{ env.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${ROLE_ARN:-}" ]; then
            echo '::error title=AWS_ROLE_ARN missing::Repository secret AWS_ROLE_ARN is empty. Add it under Settings > Secrets and variables > Actions > Secrets.'
            missing=1
          fi
          if [ -z "${INSTANCE_ID:-}" ]; then
            echo '::error title=EC2_INSTANCE_ID missing::Repository variable EC2_INSTANCE_ID is empty. Add it under Settings > Secrets and variables > Actions > Variables.'
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Deploying to instance $INSTANCE_ID in $AWS_REGION"
      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}
      - name: Deploy with health check and automatic rollback
        env:
          IMAGE: ${{ needs.build-push.outputs.image }}:${{ github.sha }}
          INSTANCE_ID: ${{ env.EC2_INSTANCE_ID }}
          CONTAINER_NAME: devops-task-service
        shell: bash
        run: |
          set -euo pipefail
          commands_json=$(printf '%s\n' \
            'set -eu' \
            "IMAGE='$IMAGE'" \
            "CONTAINER='$CONTAINER_NAME'" \
            'PREVIOUS=$(docker inspect --format="{{.Config.Image}}" "$CONTAINER" 2>/dev/null || true)' \
            'aws ecr get-login-password --region '"$AWS_REGION"' | docker login --username AWS --password-stdin '"${IMAGE%%/*}" \
            'docker pull "$IMAGE"' \
            'docker rm -f "$CONTAINER" >/dev/null 2>&1 || true' \
            'docker run -d --name "$CONTAINER" --restart unless-stopped -p 80:3000 -e PORT=3000 "$IMAGE"' \
            'ok=0; for attempt in $(seq 1 20); do if curl --fail --silent http://127.0.0.1:80/health >/dev/null; then ok=1; break; fi; sleep 3; done' \
            'if [ "$ok" -eq 1 ]; then exit 0; fi' \
            'docker logs "$CONTAINER" || true' \
            'docker rm -f "$CONTAINER" >/dev/null 2>&1 || true' \
            'if [ -n "$PREVIOUS" ]; then docker run -d --name "$CONTAINER" --restart unless-stopped -p 80:3000 -e PORT=3000 "$PREVIOUS"; fi' \
            'exit 1' | jq -R -s -c 'split("\n")[:-1]')
          parameters=$(jq -cn --argjson commands "$commands_json" '{commands: $commands}')
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${IMAGE##*/}" \
            --parameters "$parameters" \
            --query 'Command.CommandId' --output text)
          echo "SSM command: $command_id"
          for attempt in $(seq 1 60); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)
            case "$status" in
              Success) echo 'Deployment and /health smoke test succeeded.'; exit 0 ;;
              Failed|Cancelled|TimedOut) aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --output json; exit 1 ;;
            esac
            sleep 5
          done
          echo 'Timed out waiting for SSM deployment command.'
          exit 1
